spring.application.name=interview-service
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/interviewdb}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false

judge0.url=${JUDGE0_URL:https://ce.judge0.com}

jwt.secret=${JWT_SECRET:this-is-a-very-long-secret-key-for-jwt-signing-min-32-chars}

server.port=${PORT:8081}